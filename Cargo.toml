[package]
name = "javaid"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-or-later"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fancy-regex = "0.20.0"
ignore = "0.4.34"
memchr = "2.8.3"
rayon = "1.12.0"
regex = "1.13.1"
roxmltree = "0.21.2"
rustc-hash = "2.1.3"
tree-sitter = "0.27.1"
tree-sitter-java = "0.23.5"
tree-sitter-java-orchard = "0.5.23"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
