name: release
# Pushing a tag vX.Y.Z publishes that version to crates.io, after the same checks CI runs.
#
# Safeguards, so that neither a stranger nor a mistaken tag can publish:
# - only collaborators can push tags, and v* tags cannot be moved or deleted (repository rulesets);
# - the tag must name the version in Cargo.toml, and its commit must be on main;
# - the job runs in the `release` environment, which only v* tags may use and which waits for a
#   maintainer's approval in the Actions tab before anything runs;
# - crates.io accepts only this repository, this workflow file and this environment
#   (trusted publishing: no stored token; the one it issues lasts for this job only);
# - third-party actions are pinned to commit SHAs, and this job uses no build cache.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing: GitHub vouches for this job to crates.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history of main, for the check below
          persist-credentials: false
      - name: The tag names the version in Cargo.toml, and its commit is on main
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "the commit of $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - name: Authenticate with crates.io (trusted publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
