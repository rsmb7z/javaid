name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      # The unit tests and the Checkstyle-derived probe fixtures: no Java and no corpora needed.
      - run: cargo test --locked
      - run: cargo build --release --locked
      # What crates.io would receive builds on its own (see `include` in Cargo.toml).
      - run: cargo package --locked
